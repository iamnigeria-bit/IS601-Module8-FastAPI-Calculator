
name: FastAPI Calculator Tests

on:
  push:
    branches: [main, module10-secure-users]
  pull_request:
    branches: [main, module10-secure-users]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: module10_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: module10_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U module10_test -d module10_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg://module10_test:local_test_only@127.0.0.1:5432/module10_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright
        run: python -m playwright install --with-deps chromium

      - name: Test PostgreSQL integration
        run: python -m pytest tests/test_users_postgres.py -v -rs

      - name: Run all tests
        run: python -m pytest -v
