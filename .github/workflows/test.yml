
name: FastAPI Calculator Tests

on:
  push:
    branches:
      - main
      - module10-secure-users
      - module11-calculation-model
      - module12-user-calculation-routes
  pull_request:
    branches:
      - main
      - module10-secure-users
      - module11-calculation-model
      - module12-user-calculation-routes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: module10_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: module10_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U module10_test -d module10_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg://module10_test:local_test_only@127.0.0.1:5432/module10_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright
        run: python -m playwright install --with-deps chromium

      - name: Test PostgreSQL integration
        run: |
          python -m pytest tests/test_users_postgres.py tests/test_calculations_postgres.py tests/integration/test_module12_routes.py -v

      - name: Run all tests
        run: python -m pytest -q

  publish:
    name: Publish Docker Image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/module12-user-calculation-routes'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for security scanning
        run: docker build -t module12-fastapi:scan .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: module12-fastapi:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            brownie97/module10-fastapi:latest
            brownie97/module10-fastapi:module12
